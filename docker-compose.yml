services:
  mysql:
    image: mysql:8.4
    container_name: fancyhotel-mysql
    environment:
      MYSQL_ROOT_PASSWORD: password
      MYSQL_DATABASE: Fancy_Hotel
    ports:
      - "3306:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-ppassword"]
      interval: 5s
      timeout: 5s
      retries: 20
    volumes:
      - fancyhotel_mysql:/var/lib/mysql

volumes:
  fancyhotel_mysql:
