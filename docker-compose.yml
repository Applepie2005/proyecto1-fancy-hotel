services:
  mysql:
    image: mysql:8.4
    container_name: fancyhotel-mysql
    environment:
      MYSQL_ROOT_PASSWORD: password
      MYSQL_DATABASE: Fancy_Hotel
    ports:
      - "3306:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-ppassword"]
      interval: 5s
      timeout: 5s
      retries: 20
    volumes:
      - fancyhotel_mysql:/var/lib/mysql

  web:
    build: .
    container_name: fancyhotel-web
    ports:
      - "5001:5001"
    environment:
      FANCYHOTEL_HOST: "0.0.0.0"
      FANCYHOTEL_PORT: "5001"
      FANCYHOTEL_DEBUG: "0"
      FANCYHOTEL_DB_HOST: mysql
      FANCYHOTEL_DB_PASSWORD: password
    depends_on:
      mysql:
        condition: service_healthy
    restart: unless-stopped

volumes:
  fancyhotel_mysql:
