<div class="fh-page">
  <div class="fh-auth-gate" ng-hide="loggedInBool">
    <h2>Inicia sesión para ver informes</h2>
    <p><a class="btn btn-primary" href="#/login">Ir a login</a></p>
  </div>

  <div ng-show="loggedInBool">
    <header class="fh-page-header">
      <h1>Categorías de habitación populares</h1>
      <p class="fh-lead">Sesión: <strong>{{currentUser}}</strong></p>
    </header>

    <div class="fh-alert fh-alert--warn" ng-show="userType=='customer'">
      Solo gerentes pueden ver informes. Inicia sesión con una cuenta de gerente.
    </div>

    <div ng-show="userType=='manager'">
      <div class="fh-panel">
        <ul class="fh-report-list">
          <li ng-repeat="(month, locgroup) in popCatReport">
            <strong>{{getMonth(month)}}</strong>
            <ul ng-repeat="(location, stats) in locgroup">
              <li><strong>{{location}}</strong>
                <ul>
                  <li ng-repeat="stat in stats">{{stat.type}}: {{stat.count}}</li>
                </ul>
              </li>
            </ul>
          </li>
        </ul>
      </div>
    </div>

    <a class="fh-back" href="#/portal">← Volver al portal</a>
  </div>
</div>
