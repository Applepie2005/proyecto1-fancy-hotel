<div class="fh-page">
  <header class="fh-page-header">
    <h1>Iniciar sesión</h1>
    <p class="fh-lead">Accede al portal de Fancy Hotel con tu usuario de cliente o gerente.</p>
  </header>

  <div class="fh-alert fh-alert--info" ng-show="loggedInBool">
    Ya tienes sesión activa. Ve al <a href="#/portal">portal de usuario</a>.
  </div>

  <div class="fh-panel fh-form" ng-hide="loggedInBool">
    <form role="form" ng-submit="submit()">
      <div class="form-group">
        <label for="username">Usuario</label>
        <input id="username" type="text" class="form-control" placeholder="Ej. C0001" ng-model="username" autocomplete="username" required>
      </div>
      <div class="form-group">
        <label for="pwd">Contraseña</label>
        <input id="pwd" type="password" class="form-control" placeholder="Contraseña" ng-model="password" autocomplete="current-password" required>
      </div>
      <button type="submit" class="btn btn-primary">Entrar</button>
    </form>
    <p class="help-text" style="margin-top: 1rem;">¿Usuario nuevo? <a href="#/register">Regístrate aquí</a></p>
  </div>
</div>
