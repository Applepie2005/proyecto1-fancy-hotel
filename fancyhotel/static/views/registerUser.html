<div class="fh-page">
  <header class="fh-page-header">
    <h1>Registro de cliente</h1>
    <p class="fh-lead">Los gerentes no se registran; usan cuentas precargadas en el sistema.</p>
  </header>

  <div class="fh-alert fh-alert--info" ng-show="loggedInBool">
    Ya tienes sesión activa. Ve al <a href="#/portal">portal de usuario</a>.
  </div>

  <div class="fh-panel fh-form" ng-hide="loggedInBool">
    <form role="form" ng-submit="submit()" name="register">
      <div class="form-group">
        <label for="reg-username">Usuario</label>
        <input id="reg-username" type="text" class="form-control" placeholder="C seguido de 4 caracteres" ng-model="username" required ng-pattern="myRegex">
        <p class="help-text">Debe empezar con C y tener 4 letras o números después.</p>
        <p class="help-text text-danger" ng-show="register.username.$error.pattern">Formato de usuario inválido.</p>
      </div>
      <div class="fh-form-row">
        <div class="form-group">
          <label for="firstName">Nombre</label>
          <input id="firstName" type="text" class="form-control" ng-model="firstName" required>
        </div>
        <div class="form-group">
          <label for="lastName">Apellido</label>
          <input id="lastName" type="text" class="form-control" ng-model="lastName" required>
        </div>
      </div>
      <div class="form-group">
        <label for="email">Correo</label>
        <input id="email" type="email" class="form-control" ng-model="email" required>
      </div>
      <div class="fh-form-row">
        <div class="form-group">
          <label for="password">Contraseña</label>
          <input id="password" type="password" class="form-control" ng-model="password" required minlength="6">
          <p class="help-text">Mínimo 6 caracteres.</p>
        </div>
        <div class="form-group">
          <label for="confirmPass">Confirmar contraseña</label>
          <input id="confirmPass" type="password" class="form-control" ng-model="confirmPass" required minlength="6">
        </div>
      </div>
      <button type="submit" class="btn btn-primary">Registrar cuenta</button>
    </form>
    <p class="help-text" style="margin-top: 1rem;">¿Ya tienes cuenta? <a href="#/login">Inicia sesión</a></p>
  </div>
</div>
